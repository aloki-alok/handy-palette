name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - Sources/KanaCore/Resources/starter-library.json
      - Scripts/build_pages.sh
      - Scripts/serve_pages.sh
      - Tests/web/**
      - package.json
      - package-lock.json
      - playwright.config.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify interactive preview
        run: npm run test:web
      - name: Build site artifact
        run: ./Scripts/build_pages.sh .build/pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .build/pages
      - id: deployment
        uses: actions/deploy-pages@v5
